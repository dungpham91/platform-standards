name: terraform-ci

# Path-filtered Terraform checks. Full IaC/container scans run in pr-quality-gate.yml on every PR.

on:
  pull_request:
    paths:
      - "src/problem1/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_VERSION: "1.16.6"
  TG_VERSION: "1.1.6"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install Terragrunt
        run: |
          curl -sSfL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Terraform fmt check
        run: terraform fmt -check -recursive src/problem1/terraform

      - name: Terraform module I/O sort (A-Z)
        run: bash scripts/terraform-io-sort.sh --check

      - name: Terragrunt HCL format
        run: bash scripts/terragrunt-fmt-check.sh

      - name: Terraform validate all modules
        run: bash scripts/terraform-validate-all-modules.sh
