name: pr-quality-gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCAN_SEVERITY: CRITICAL,HIGH,MEDIUM,LOW
  TF_VERSION: "1.16.6"
  TG_VERSION: "1.1.6"
  TRIVY_VERSION: "0.76.0"
  CHECKOV_VERSION: "3.3.30"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Dependency Review runs on pull requests only."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'pull_request'
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@578271f31aced1668b000a222212877bf341416 # v4.2.0
        with:
          fail-on-severity: moderate

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        with:
          languages: javascript
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          category: problem3-problem4-javascript

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks scan (all severities) + SARIF
        run: |
          mkdir -p reports
          gitleaks detect --source . --no-banner --config .gitleaks.toml \
            --report-format sarif --report-path reports/gitleaks.sarif \
            --exit-code 1
      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always()
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Install Terragrunt
        run: |
          curl -sSfL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version
      - run: terraform fmt -check -recursive src/problem1/terraform
      - name: Terraform module I/O sort (A-Z)
        run: bash scripts/terraform-io-sort.sh --check
      - name: Terragrunt HCL format
        run: bash scripts/terragrunt-fmt-check.sh
      - name: Terraform validate all modules
        run: bash scripts/terraform-validate-all-modules.sh
      - name: Install Checkov
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
      - name: Checkov SARIF (terraform + compose)
        run: bash scripts/checkov-iac-sarif.sh reports
      - name: Checkov gate
        run: bash scripts/checkov-iac-gate.sh
      - name: Upload Checkov Terraform SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always()
        with:
          sarif_file: reports/checkov-terraform.sarif
          category: checkov-terraform
      - name: Upload Checkov Compose SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always()
        with:
          sarif_file: reports/checkov-docker-compose.sarif
          category: checkov-docker-compose
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Trivy IaC (SARIF + gate)
        run: |
          mkdir -p reports
          mapfile -t IAC_DIRS < <(bash scripts/iac-scan-paths.sh --relative)
          trivy config --format sarif --output reports/trivy-terraform.sarif \
            --severity "${SCAN_SEVERITY}" "${IAC_DIRS[@]}"
          trivy config --format table --severity "${SCAN_SEVERITY}" "${IAC_DIRS[@]}"
          trivy config --exit-code 1 --severity "${SCAN_SEVERITY}" "${IAC_DIRS[@]}"
        env:
          SCAN_SEVERITY: ${{ env.SCAN_SEVERITY }}
      - name: Upload Trivy Terraform SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always()
        with:
          sarif_file: reports/trivy-terraform.sarif
          category: trivy-terraform

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/problem4/apps/backend/package-lock.json
      - working-directory: src/problem4/apps/backend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  problem3-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compose smoke (/ + /api/users)
        run: bash tests/problem3_smoke.sh

  problem3-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/problem3/api/package-lock.json
      - working-directory: src/problem3/api
        run: |
          npm ci
          npm test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/problem4/apps/frontend/package-lock.json
      - working-directory: src/problem4/apps/frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  backend-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Build image for scan
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: src/problem4/apps/backend
          push: false
          load: true
          tags: platform-trading-api:pr-scan
          provenance: false
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Trivy image (SARIF + gate)
        run: |
          mkdir -p reports
          trivy image --format sarif --output reports/trivy-image.sarif \
            --severity ${{ env.SCAN_SEVERITY }} platform-trading-api:pr-scan
          trivy image --format table --severity ${{ env.SCAN_SEVERITY }} platform-trading-api:pr-scan
          trivy image --exit-code 1 --severity ${{ env.SCAN_SEVERITY }} platform-trading-api:pr-scan
      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8 # v3.28.0
        if: always()
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

  problem3-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0
      - name: Build Problem 3 API image for scan
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: src/problem3/api
          push: false
          load: true
          tags: platform-stack-api:pr-scan
          provenance: false
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Trivy image Problem 3 (gate)
        run: |
          trivy image --format table --severity ${{ env.SCAN_SEVERITY }} platform-stack-api:pr-scan
          trivy image --exit-code 1 --severity ${{ env.SCAN_SEVERITY }} platform-stack-api:pr-scan

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -shellcheck= .github/workflows/*.yml

  shell-and-repo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          SHFMT_VERSION=v3.10.0
          curl -sSfL "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64" -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt
          shfmt --version
      - name: Lint shell scripts and workflows
        run: bash scripts/lint-shell.sh

  gate:
    needs:
      - dependency-review
      - codeql
      - secrets
      - terraform
      - backend-tests
      - frontend-tests
      - problem3-api-tests
      - problem3-compose-smoke
      - backend-image-scan
      - problem3-image-scan
      - workflows
      - shell-and-repo-lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "All PR quality gates passed."
